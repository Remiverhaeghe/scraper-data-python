<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Arial, sans-serif">
<defs><marker id="fleche" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="450.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Changement de série avant et après SMED</text>
<text x="40.0" y="78.0" text-anchor="start" font-size="15" font-weight="bold" fill="#0f172a">Avant</text>
<rect x="120.0" y="56.0" width="620.0" height="40.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="430.0" y="80.7" text-anchor="middle" font-size="14" fill="#0f172a">Arrêt machine : recherche d'outils, démontage, réglages, essais</text>
<text x="40.0" y="168.0" text-anchor="start" font-size="15" font-weight="bold" fill="#0f172a">Après</text>
<rect x="120.0" y="146.0" width="200.0" height="40.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="220.0" y="170.7" text-anchor="middle" font-size="14" fill="#0f172a">Externe : préparer</text>
<rect x="330.0" y="146.0" width="220.0" height="40.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="440.0" y="170.7" text-anchor="middle" font-size="14" fill="#0f172a">Interne réduit</text>
<rect x="560.0" y="146.0" width="180.0" height="40.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="650.0" y="170.7" text-anchor="middle" font-size="14" fill="#0f172a">Externe : ranger</text>
<text x="450.0" y="228.0" text-anchor="middle" font-size="14" fill="#15803d">Machine en marche (externe)</text>
<text x="450.0" y="250.0" text-anchor="middle" font-size="14" fill="#b91c1c">Machine arrêtée (interne)</text>
<text x="450.0" y="282.0" text-anchor="middle" font-size="14" fill="#475569">Séparer, convertir l'interne en externe, puis réduire ce qui reste</text>
</svg>
