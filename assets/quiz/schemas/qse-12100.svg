<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" font-family="Arial, sans-serif">
<defs><marker id="fleche" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
<rect width="900" height="410" fill="#ffffff"/>
<text x="450.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Appréciation et réduction du risque (ISO 12100)</text>
<text x="200.0" y="62.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Appréciation du risque</text>
<rect x="40.0" y="74.0" width="320.0" height="44.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="200.0" y="100.7" text-anchor="middle" font-size="14" fill="#0f172a">Déterminer les limites</text>
<line x1="200.0" y1="118.0" x2="200.0" y2="134.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="40.0" y="136.0" width="320.0" height="44.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="200.0" y="162.7" text-anchor="middle" font-size="14" fill="#0f172a">Identifier les phénomènes dangereux</text>
<line x1="200.0" y1="180.0" x2="200.0" y2="196.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="40.0" y="198.0" width="320.0" height="44.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="200.0" y="224.7" text-anchor="middle" font-size="14" fill="#0f172a">Estimer le risque</text>
<line x1="200.0" y1="242.0" x2="200.0" y2="258.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="40.0" y="260.0" width="320.0" height="44.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="200.0" y="286.7" text-anchor="middle" font-size="14" fill="#0f172a">Évaluer le risque</text>
<line x1="200.0" y1="304.0" x2="200.0" y2="320.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="40.0" y="322.0" width="320.0" height="44.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="200.0" y="348.7" text-anchor="middle" font-size="14" fill="#0f172a">Risque réduit de façon adéquate ?</text>
<text x="380.0" y="340.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">non</text>
<line x1="360.0" y1="344.0" x2="518.0" y2="120.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<text x="150.0" y="394.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">oui : fin, risque résiduel documenté</text>
<text x="690.0" y="62.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Réduction du risque, dans cet ordre</text>
<rect x="520.0" y="90.0" width="340.0" height="64.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="690.0" y="118.2" text-anchor="middle" font-size="14" fill="#0f172a">Étape 1 : prévention intrinsèque</text>
<text x="690.0" y="135.2" text-anchor="middle" font-size="14" fill="#0f172a">supprimer le danger à la conception</text>
<line x1="690.0" y1="154.0" x2="690.0" y2="183.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="520.0" y="185.0" width="340.0" height="64.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="690.0" y="213.2" text-anchor="middle" font-size="14" fill="#0f172a">Étape 2 : protecteurs et</text>
<text x="690.0" y="230.2" text-anchor="middle" font-size="14" fill="#0f172a">dispositifs de protection</text>
<line x1="690.0" y1="249.0" x2="690.0" y2="278.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<rect x="520.0" y="280.0" width="340.0" height="64.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="690.0" y="308.2" text-anchor="middle" font-size="14" fill="#0f172a">Étape 3 : informations</text>
<text x="690.0" y="325.2" text-anchor="middle" font-size="14" fill="#0f172a">pour l'utilisation</text>
<line x1="520.0" y1="312.0" x2="362.0" y2="160.0" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fleche)"/>
<text x="690.0" y="380.0" text-anchor="middle" font-size="13" fill="#475569">Après chaque mesure, on recommence l'appréciation</text>
</svg>
