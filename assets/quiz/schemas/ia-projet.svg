<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Arial, sans-serif">
<defs><marker id="fleche" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
<rect width="900" height="380" fill="#ffffff"/>
<text x="450.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Cycle de vie d&#x27;un projet de machine learning</text>
<rect x="30.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="125.0" y="106.2" text-anchor="middle" font-size="14" fill="#0f172a">1. Définir le besoin</text>
<text x="125.0" y="123.2" text-anchor="middle" font-size="14" fill="#0f172a">et la mesure du succès</text>
<rect x="245.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="340.0" y="106.2" text-anchor="middle" font-size="14" fill="#0f172a">2. Collecter</text>
<text x="340.0" y="123.2" text-anchor="middle" font-size="14" fill="#0f172a">les données</text>
<rect x="460.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="555.0" y="106.2" text-anchor="middle" font-size="14" fill="#0f172a">3. Nettoyer</text>
<text x="555.0" y="123.2" text-anchor="middle" font-size="14" fill="#0f172a">et étiqueter</text>
<rect x="675.0" y="70.0" width="190.0" height="80.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="770.0" y="106.2" text-anchor="middle" font-size="14" fill="#0f172a">4. Entraîner</text>
<text x="770.0" y="123.2" text-anchor="middle" font-size="14" fill="#0f172a">le modèle</text>
<rect x="675.0" y="220.0" width="190.0" height="80.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="770.0" y="256.2" text-anchor="middle" font-size="14" fill="#0f172a">5. Évaluer sur</text>
<text x="770.0" y="273.2" text-anchor="middle" font-size="14" fill="#0f172a">le jeu de test</text>
<rect x="460.0" y="220.0" width="190.0" height="80.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="555.0" y="256.2" text-anchor="middle" font-size="14" fill="#0f172a">6. Déployer</text>
<text x="555.0" y="273.2" text-anchor="middle" font-size="14" fill="#0f172a">en production</text>
<rect x="245.0" y="220.0" width="190.0" height="80.0" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="340.0" y="256.2" text-anchor="middle" font-size="14" fill="#0f172a">7. Surveiller</text>
<text x="340.0" y="273.2" text-anchor="middle" font-size="14" fill="#0f172a">les performances</text>
<rect x="30.0" y="220.0" width="190.0" height="80.0" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="125.0" y="256.2" text-anchor="middle" font-size="14" fill="#0f172a">8. Réentraîner avec</text>
<text x="125.0" y="273.2" text-anchor="middle" font-size="14" fill="#0f172a">des données récentes</text>
<line x1="220.0" y1="110.0" x2="243.0" y2="110.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="435.0" y1="110.0" x2="458.0" y2="110.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="650.0" y1="110.0" x2="673.0" y2="110.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="770.0" y1="150.0" x2="770.0" y2="218.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="675.0" y1="260.0" x2="652.0" y2="260.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="460.0" y1="260.0" x2="437.0" y2="260.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="245.0" y1="260.0" x2="222.0" y2="260.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="160.0" y1="220.0" x2="320.0" y2="152.0" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fleche)"/>
<text x="450.0" y="340.0" text-anchor="middle" font-size="13" fill="#475569">Le cycle reprend à l&#x27;étape 2 quand la production change (matière, réglage, capteur)</text>
<text x="450.0" y="362.0" text-anchor="middle" font-size="13" fill="#475569">Étapes 1 à 5 : le projet · étapes 6 à 8 : l&#x27;exploitation (MLOps)</text>
</svg>
