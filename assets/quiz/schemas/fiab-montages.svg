<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="Arial, sans-serif">
<defs><marker id="fleche" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
<rect width="900" height="290" fill="#ffffff"/>
<text x="450.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Fiabilité d'un système</text>
<text x="220.0" y="72.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">En série : tout doit fonctionner</text>
<rect x="40.0" y="100.0" width="100.0" height="50.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="90.0" y="129.7" text-anchor="middle" font-size="14" fill="#0f172a">A  0,95</text>
<rect x="170.0" y="100.0" width="100.0" height="50.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="220.0" y="129.7" text-anchor="middle" font-size="14" fill="#0f172a">B  0,90</text>
<rect x="300.0" y="100.0" width="100.0" height="50.0" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="350.0" y="129.7" text-anchor="middle" font-size="14" fill="#0f172a">C  0,98</text>
<line x1="142.0" y1="125.0" x2="167.0" y2="125.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="272.0" y1="125.0" x2="297.0" y2="125.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<text x="220.0" y="186.0" text-anchor="middle" font-size="14" fill="#0f172a">R = 0,95 × 0,90 × 0,98 ≈ 0,84</text>
<text x="680.0" y="72.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">En parallèle : une seule suffit</text>
<rect x="630.0" y="90.0" width="110.0" height="46.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="685.0" y="117.7" text-anchor="middle" font-size="14" fill="#0f172a">P1  0,90</text>
<rect x="630.0" y="150.0" width="110.0" height="46.0" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="685.0" y="177.7" text-anchor="middle" font-size="14" fill="#0f172a">P2  0,90</text>
<line x1="560" y1="143" x2="600" y2="143" stroke="#334155" stroke-width="2"/>
<line x1="600" y1="113" x2="600" y2="173" stroke="#334155" stroke-width="2"/>
<line x1="600.0" y1="113.0" x2="627.0" y2="113.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="600.0" y1="173.0" x2="627.0" y2="173.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="742" y1="113" x2="780" y2="113" stroke="#334155" stroke-width="2"/>
<line x1="742" y1="173" x2="780" y2="173" stroke="#334155" stroke-width="2"/>
<line x1="780" y1="113" x2="780" y2="173" stroke="#334155" stroke-width="2"/>
<line x1="780.0" y1="143.0" x2="830.0" y2="143.0" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
<text x="680.0" y="226.0" text-anchor="middle" font-size="14" fill="#0f172a">R = 1 - (0,1 × 0,1) = 0,99</text>
<text x="450.0" y="270.0" text-anchor="middle" font-size="14" fill="#475569">La redondance protège les points faibles ; la série additionne les risques</text>
</svg>
