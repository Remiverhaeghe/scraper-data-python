name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Les actions sont épinglées par empreinte de commit : une étiquette déplacée ne
# peut pas changer le code exécuté. Dependabot propose les nouvelles versions.

jobs:
  tests:
    name: Tests et formatage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      # Bibliothèques système chargées par Qt, même en mode sans écran
      - name: Installation des bibliothèques Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # Navigateur des tests de bout en bout du tableau de bord (tests/e2e)
      - name: Installation de Chromium pour Playwright
        run: python -m playwright install --with-deps chromium

      - name: Vérification du formatage
        run: black --check .

      # Qualité du code : la configuration (convention p, v, r) est dans pyproject.toml.
      - name: Analyse pylint
        run: pylint $(git ls-files '*.py' | grep -v '^tests/') --fail-under=9.8

      # Sécurité : toute alerte non justifiée par un « nosec » commenté fait échouer.
      - name: Analyse de sécurité bandit
        run: bandit -q -r . -x ./tests

      # Le seuil de couverture est défini dans pyproject.toml ; -n auto répartit les
      # tests sur tous les cœurs de la machine (pytest-xdist).
      - name: Tests et couverture
        run: pytest -q -n auto --cov

  # L'application s'utilise sous Windows : les tests y tournent aussi, pour voir
  # tôt un écart entre systèmes (chemins, Qt, encodage). Formatage et analyses
  # donnent le même résultat partout : ils restent dans le job Linux.
  tests-windows:
    name: Tests sous Windows
    runs-on: windows-latest

    # Encodage UTF-8 imposé : la console Windows n'affiche pas les accents sinon.
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Installation de Chromium pour Playwright
        run: python -m playwright install chromium

      - name: Tests et couverture
        run: pytest -q -n auto --cov

  # Application Flutter du dossier mobile/ : analyse et tests, dont les cas de
  # correction communs avec le serveur (tests/fixtures/shared_quiz_cases.json).
  mobile:
    name: Application mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      # Largeur des lignes fixée dans analysis_options.yaml
      - name: Vérification du formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse du code
        run: flutter analyze

      - name: Tests
        run: flutter test

  integration:
    name: Synchronisation téléphone ↔ serveur
    runs-on: ubuntu-latest

    # Le vrai serveur, sur une base neuve dans un dossier temporaire, et le vrai
    # code de l'application : contenu, offres, réponse, signalement, examen,
    # simulation d'entretien, auto-évaluation et statut d'offre échangés.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          cd mobile && flutter pub get

      - name: Base neuve et serveur
        run: |
          mkdir -p "$RUNNER_TEMP/integration" && cd "$RUNNER_TEMP/integration"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m tools.mobile_integration prepare > token.txt
          PYTHONPATH="$GITHUB_WORKSPACE" nohup python -m uvicorn web.app:app --port 8765 > server.log 2>&1 &
          for vTry in $(seq 30); do
            curl -sf http://127.0.0.1:8765/api/v1/ping && break
            sleep 1
          done

      - name: Synchronisation depuis l'application
        working-directory: mobile
        run: |
          export JOBBOARD_SERVER=http://127.0.0.1:8765
          export JOBBOARD_TOKEN="$(cat "$RUNNER_TEMP/integration/token.txt")"
          flutter test test/integration

      - name: Contrôle de ce que le serveur a reçu
        run: cd "$RUNNER_TEMP/integration" && PYTHONPATH="$GITHUB_WORKSPACE" python -m tools.mobile_integration check

      - name: Journal du serveur en cas d'échec
        if: failure()
        run: cat "$RUNNER_TEMP/integration/server.log"

  # Image du NAS : construite, puis lancée avec le même durcissement que
  # docker-compose.yml, sur des données vides.
  docker:
    name: Image Docker du NAS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Construction de l'image
        run: docker build -t jobboard-perso:ci .

      - name: Démarrage du conteneur durci
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/logs"
          # Le compte du conteneur (10001) écrit seulement dans ces deux dossiers.
          sudo chown 10001 "$RUNNER_TEMP/data" "$RUNNER_TEMP/logs"
          docker run -d --name jobboard \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$RUNNER_TEMP/data:/app/data" -v "$RUNNER_TEMP/logs:/app/logs" \
            -e WEB_HOST=0.0.0.0 -p 127.0.0.1:8000:8000 \
            jobboard-perso:ci

      - name: Réponse du tableau de bord et compte sans privilèges
        run: |
          for vTry in $(seq 30); do
            curl -sf http://127.0.0.1:8000/api/v1/ping && break
            sleep 1
          done
          docker exec jobboard python -m web.healthcheck
          test "$(docker exec jobboard id -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$RUNNER_TEMP/data:/app/data" -v "$RUNNER_TEMP/logs:/app/logs" \
            jobboard-perso:ci python -m scheduler --once

      - name: Journal du conteneur en cas d'échec
        if: failure()
        run: docker logs jobboard

  audit:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Compare les versions de requirements.txt aux failles publiées (base PyPI/OSV)
      - name: Analyse pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
          pip-audit -r requirements-server.lock

      # Dépendances de l'application mobile (pubspec.lock), même base OSV ;
      # go install vérifie l'empreinte du code auprès de sum.golang.org.
      - name: Analyse osv-scanner de l'application mobile
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          "$(go env GOPATH)/bin/osv-scanner" scan source --lockfile mobile/pubspec.lock

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
