name: APK

# Construit l'application mobile à chaque version publiée (étiquette v1.2.0), à chaque
# fusion sur main qui touche mobile/, ou à la demande depuis l'onglet Actions.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["mobile/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: APK par type de processeur
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signature.outputs.signed }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Le JDK 17 est déjà présent sur les machines Ubuntu de GitHub.
      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      # Signature avec la clé personnelle si les secrets sont définis : l'APK
      # remplace alors celui installé. Sans eux, la clé de débogage est utilisée
      # et l'application installée doit d'abord être désinstallée.
      - name: Clé de signature
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Signature avec la clé personnelle"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets absents : signature avec la clé de débogage"
          fi

      - name: Installation des dépendances
        run: flutter pub get

      - name: Textes de l'application
        run: flutter gen-l10n

      - name: Construction
        # Numéro de construction croissant : Android refuse une mise à jour dont le
        # versionCode n'augmente pas
        run: flutter build apk --release --split-per-abi --build-number="$GITHUB_RUN_NUMBER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jobboard-revision-apk
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  # Chaque fusion sur main publie l'APK dans une préversion « mobile-build-N » : Obtainium,
  # sur le téléphone, la voit et propose la mise à jour. Seulement avec la clé personnelle,
  # sinon chaque APK aurait une signature différente et ne remplacerait pas la précédente.
  preversion:
    name: Préversion pour Obtainium
    runs-on: ubuntu-latest
    needs: apk
    if: github.ref == 'refs/heads/main' && needs.apk.outputs.signed == 'true'
    permissions:
      contents: write
    concurrency:
      group: preversion
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jobboard-revision-apk
          path: apk

      - name: Publication et ménage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: mobile-build-${{ github.run_number }}
        run: |
          gh release create "$TAG" apk/*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Appli mobile, construction ${{ github.run_number }}" \
            --notes "APK construite depuis main ($GITHUB_SHA). Installation et mises à jour : mobile/README.md."
          # Les trois dernières préversions suffisent : les plus anciennes et leur tag sont supprimés
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("mobile-build-")))] | .[3:] | .[].tagName' |
            while read -r vTag; do
              gh release delete "$vTag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

