<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Arial, sans-serif">
  <rect width="820" height="320" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Plaque à bornes d'un moteur triphasé : les deux couplages</text>
  <g font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">
    <text x="205" y="62">Étoile</text>
    <text x="615" y="62">Triangle</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="#f8fafc">
    <circle cx="125" cy="110" r="20"/>
    <circle cx="205" cy="110" r="20"/>
    <circle cx="285" cy="110" r="20"/>
    <circle cx="125" cy="190" r="20"/>
    <circle cx="205" cy="190" r="20"/>
    <circle cx="285" cy="190" r="20"/>
    <circle cx="535" cy="110" r="20"/>
    <circle cx="615" cy="110" r="20"/>
    <circle cx="695" cy="110" r="20"/>
    <circle cx="535" cy="190" r="20"/>
    <circle cx="615" cy="190" r="20"/>
    <circle cx="695" cy="190" r="20"/>
  </g>
  <g stroke="#b45309" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="125" y1="110" x2="285" y2="110"/>
    <line x1="535" y1="110" x2="535" y2="190"/>
    <line x1="615" y1="110" x2="615" y2="190"/>
    <line x1="695" y1="110" x2="695" y2="190"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="125" y="84">W2</text>
    <text x="205" y="84">U2</text>
    <text x="285" y="84">V2</text>
    <text x="125" y="228">U1</text>
    <text x="205" y="228">V1</text>
    <text x="285" y="228">W1</text>
    <text x="510" y="84">W2</text>
    <text x="590" y="84">U2</text>
    <text x="670" y="84">V2</text>
    <text x="510" y="228">U1</text>
    <text x="590" y="228">V1</text>
    <text x="670" y="228">W1</text>
  </g>
  <g stroke="#0f172a" stroke-width="2.5">
    <line x1="125" y1="210" x2="125" y2="250"/>
    <line x1="205" y1="210" x2="205" y2="250"/>
    <line x1="285" y1="210" x2="285" y2="250"/>
    <line x1="535" y1="210" x2="535" y2="250"/>
    <line x1="615" y1="210" x2="615" y2="250"/>
    <line x1="695" y1="210" x2="695" y2="250"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="125" y="266">L1</text>
    <text x="205" y="266">L2</text>
    <text x="285" y="266">L3</text>
    <text x="535" y="266">L1</text>
    <text x="615" y="266">L2</text>
    <text x="695" y="266">L3</text>
  </g>
  <g font-size="14" fill="#475569" text-anchor="middle">
    <text x="205" y="296">Une barrette relie W2, U2 et V2 :</text>
    <text x="205" y="314">chaque enroulement reçoit la tension simple</text>
    <text x="615" y="296">Trois barrettes verticales :</text>
    <text x="615" y="314">chaque enroulement reçoit la tension composée</text>
  </g>
</svg>
