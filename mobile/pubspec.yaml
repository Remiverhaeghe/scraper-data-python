name: jobboard_revision
description: Révision technique hors ligne, synchronisée avec JobBoard Perso.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Jeton de l'API rangé dans le stockage chiffré du téléphone
  flutter_secure_storage: ^9.2.2
  # Schémas des questions, livrés en SVG par le serveur
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  path_provider: ^2.1.4
  # Identifiant de chaque réponse : le serveur ignore un envoi en double
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
