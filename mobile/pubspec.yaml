name: jobboard_revision
description: Révision technique hors ligne, synchronisée avec JobBoard Perso.
publish_to: "none"
version: 1.9.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  # Jeton de l'API rangé dans le stockage chiffré du téléphone
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  # Schémas des questions, livrés en SVG par le serveur
  flutter_svg: ^2.0.10+1
  flutter_timezone: ^5.1.1
  # Widget de l'écran d'accueil : questions à revoir et prochain entretien
  home_widget: ^0.9.4
  http: ^1.2.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.4
  # Identifiant de chaque réponse : le serveur ignore un envoi en double
  # Bac à sable SQL hors ligne : SQLite embarqué dans l'application
  sqlite3: ^3.8.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.5.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Icônes de lancement : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F3A8C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
